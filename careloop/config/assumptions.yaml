# ============================================================
# CareLoop — Assumption Register
# ============================================================
# Every parameter that drives clinical logic, simulation, or
# SLA calculation lives here.  ALL values are PLACEHOLDER until
# validated by a domain expert and the status field is changed
# to VALIDATED.
#
# Structure per parameter:
#   value:   <number or string>
#   unit:    <human-readable unit>
#   source:  <citation / "assumption" / "TBD">
#   status:  PLACEHOLDER | UNDER_REVIEW | VALIDATED
#   notes:   <free text>
# ============================================================

fit:
  positivity_rate:
